# The checks whose subject is the pull request rather than the tree.
#
# `check.yml` runs `make check`, and every vault gate decides a property of a
# directory. These cannot: they read the description and the set of paths the
# change touched. Those subjects do not exist outside a forge, so these are not
# vault gates and `make check-gates` does not cover them -- which is why the first
# step here is the checks' own self-test against recorded cases. A check that has
# stopped deciding fails the pull request that revealed it.
#
# The body reaches the script through the environment and never through the shell
# command line. A pull-request body is attacker-controlled text; interpolating it
# into `run:` is script injection with extra steps.
name: pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  description:
    runs-on: ubuntu-latest
    # A bot does not write the template, so it cannot answer questions the
    # template asks. Dependabot's control is dependabot-auto-merge.yml, which
    # advances patch bumps only and refuses anything touching contract/ --
    # a narrower gate than this one, not a weaker one. Stated here because an
    # exemption nobody can see is an exemption nobody reviews.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # `docs-touched` compares base...head, so both must be reachable.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: the checks are demonstrated to decide before they are trusted
        run: python3 ci/pr/checks.py --self-test

      - name: the PR creation preflight refuses invalid descriptions
        run: python3 -m unittest discover -s ci/pr -p 'test_create.py'

      - name: record the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"

      - name: the PR explains what changed and why
        run: python3 ci/pr/checks.py --check description --body "$RUNNER_TEMP/body.md"

      - name: wire contract impact is answered
        run: python3 ci/pr/checks.py --check wire-contract-impact --body "$RUNNER_TEMP/body.md"

      - name: documentation lands with the behaviour, or the omission is stated
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 ci/pr/checks.py --check docs-touched \
            --body "$RUNNER_TEMP/body.md" \
            --base "origin/$BASE_REF" --head HEAD

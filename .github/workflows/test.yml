# The per-component toolchains. Separate from check.yml, which runs the vault
# gates and needs neither Elixir nor Go -- keeping them apart means a Go
# toolchain outage cannot take the gates down with it.
#
# The FAST job declares no service containers, so nothing answers on 5432 and a
# fast-tier test that reaches for Postgres fails rather than skips
# (rebuild-plugboard task 2.7). What this job cannot do is cut the network: a
# hosted runner has one, and pretending otherwise would be a claim nobody can
# check. The rule's "no network" is held by review and by the tier's own latency
# budget, which a test waiting on a socket breaches.
name: test

on:
  push:
  pull_request:

jobs:
  python-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make lint-python

  fast:
    runs-on: ubuntu-latest
    # No `services:` block. That absence is the check.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: make -C proxy deps

      # Warm every build cache OUTSIDE the timed region. The budget's subject is
      # suite latency -- what a contributor waits for on save, which is always
      # warm -- and a cold runner compiling inside it measures a first build.
      # `make warm` lives beside each tier's own recipe so the two cannot drift;
      # restating the invocations here is what kept the budget red for three runs.
      - run: make warm

      # Routed through ci/fast-tier.py, which prints the elapsed time on every
      # run and fails above the budget declared in ci/vault.json.
      - run: make test-fast

      # Every component started -- the proxy with its application running --
      # and the provenance line it prints compared, field by field, with its
      # generated stamp and with a commit, a tree status and a version read from
      # git INDEPENDENTLY. The stamp is never the only expectation: a blank one
      # reported faithfully equals itself. Task 3.13. It runs here because this
      # job already has both toolchains and has just run `make warm`, which
      # generates the stamps.
      #
      # It is outside the timed region above: this starts four processes and its
      # subject is correctness, not latency.
      #
      # The dirty-marker probe reports INCONCLUSIVE on an already-dirty tree,
      # which is what a working copy usually is -- so a runner, whose checkout is
      # clean, is the only place that half of the check actually runs.
      - run: python3 ci/provenance-check.py

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: make -C proxy deps
      - run: make test-integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: make -C proxy deps

      # golangci-lint compiles each module, so it needs the generated build stamp
      # that every component's main imports. These steps call the action directly
      # rather than `make lint`, which declares that dependency -- so it is
      # restated here, and ci/gates/build_prerequisites.py holds the two together.
      - run: make stamp

      # One configuration for all three Go modules, at the repository root;
      # ci/gates/linter_config.py fails the build if a second copy appears.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: sidecar
          # The same tags `make -C <component> lint` uses. Without them the
          # gating and integration tiers are not compiled, their helpers read
          # as unused, and -- worse -- the tiers go unlinted entirely.
          args: --config ../.golangci.yml --build-tags gating,integration
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: terminator
          # The same tags `make -C <component> lint` uses. Without them the
          # gating and integration tiers are not compiled, their helpers read
          # as unused, and -- worse -- the tiers go unlinted entirely.
          args: --config ../.golangci.yml --build-tags gating,integration
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: conformance
          # The same tags `make -C <component> lint` uses. Without them the
          # gating and integration tiers are not compiled, their helpers read
          # as unused, and -- worse -- the tiers go unlinted entirely.
          args: --config ../.golangci.yml --build-tags gating,integration
      - run: make -C proxy lint

      # The six planted violations of rebuild-plugboard task 2.2, one per lint
      # command, each proven to be refused by that command alone. It pairs to a
      # SCRIPT rather than to a gate module -- declared in ci/vault.json
      # gate_policy.script_paired_inputs -- because it starts six external
      # processes against a copied tree, which `make check` must not do. This job
      # already sets up Elixir and runs `make -C proxy deps`, which is exactly
      # what it needs. Without this step the demonstration re-runs only when
      # somebody types it, and ci/make/elixir.mk changed under it once already.
      - run: python3 ci/proxy-tooling-check.py
      # The Go half of the same obligation: one violating module per checking
      # command, each proven to be refused by that command. Tasks 3.2 and 3.3.
      - run: python3 ci/go-tooling-check.py

  # The gating tests: written before the code they gate, red on purpose, and held
  # to a recorded baseline so a permanent red does not make every change
  # unmergeable -- and so a gate that turns green is an event somebody has to
  # acknowledge rather than a surprise.
  gating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: python3 ci/expected-outcomes.py

  conformance-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # One statically linked binary per declared platform. The suite is handed
      # to somebody writing a sidecar in a language this repository has never
      # seen; an artifact needing a matching libc is where that offer fails.
      - run: make -C conformance build

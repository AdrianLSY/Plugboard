# The security scan, on both sides. rebuild-plugboard task 3.4.
#
# Declared in ci/vault.json's runner.workflows, which is what makes this comment
# not the enforcement: ci/gates/runner.py checks this file for path filters,
# branch filters and continue-on-error, and ci/gates/correspondences.py fails if a
# workflow exists that the declaration omits. An earlier attempt at this file was
# reverted precisely because it claimed those properties while nothing read them.
#
# The weekly cron is the half that matters. A vulnerability is published against
# code that has not changed, so a scan that runs only on change finds it only when
# somebody happens to touch the file.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # govulncheck LOADS every package, so it needs the generated build stamp
      # that each component's main imports. Nothing here goes through make, so
      # the dependency the make graph expresses does not reach this job --
      # ci/gates/build_prerequisites.py holds both sides to it.
      - run: make stamp
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck, every module
        run: |
          for m in sidecar terminator conformance; do
            (cd "$m" && govulncheck ./...)
          done

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ci/broken-inputs is skipped, and the reason is load-bearing rather than
      # convenience: the violating input for `mix deps.audit` pins plug 1.3.0 with
      # two HIGH advisories ON PURPOSE. Scanning it fails every push over a defect
      # that is the point of the fixture. The previous attempt at this workflow
      # did exactly that and would have been red from its first run.
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: ci/broken-inputs

  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: make -C proxy deps
      - name: mix sobelow --exit
        run: cd proxy && mix sobelow --exit
      - name: mix deps.audit
        run: cd proxy && mix deps.audit

# The runner ci/vault.json's `runner` key declares.
#
# Until this file existed, twenty-one gates were declared blocking in
# ci/vault.json and nothing blocked: they ran when a person chose to type a
# command. That is not a hypothetical gap. A rename sat half-staged in the index
# for hours with one gate crashing on a path `git ls-files` reported as tracked,
# and it survived a completion report and a session boundary, because the only
# thing that would have caught it was a command somebody had to remember.
#
# No path filter and no branch filter: a filter is how a change that touches only
# excluded paths skips every gate. No continue-on-error: a non-zero exit that
# does not fail the job is a gate that cannot refuse. `ci/gates/runner.py` checks
# all three against the declaration, so this comment is not the enforcement.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. ci/gates/secret_scan.py scans the commit range
          # merge-base(origin/main, HEAD)..HEAD as well as the working tree. A
          # shallow checkout fetches only the pushed or pull-request ref, so
          # neither origin/main nor main resolves, the range half is EXCLUDED
          # rather than failed, and the gate passes on the working tree alone --
          # green over a credential committed and deleted within the branch.
          # Dropping this to speed CI up fails nothing; it silently halves a
          # gate. (The reason this comment used to give is gone:
          # out_of_scope.baseline_ref has been null since rebuild-plugboard
          # task 3.16, and nothing is pinned.)
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ci/gates/authoring_channels.py reads the conventions back THROUGH the
      # planning tool rather than out of the file, because an unparseable
      # config makes openspec warn and ignore it -- a state identical to an
      # empty one unless something asks the tool. So `make check` needs the
      # binary, and a runner without it fails four blocking gates. Pinned,
      # not floating: docs/method/supply-chain.md gates dependency movement on
      # semver-patch, and a planning tool that changes its JSON shape under CI
      # is the same silent-drift class the gate itself exists to catch.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install -g @fission-ai/openspec@1.13.0

      # The aggregating target. It enumerates every gate it ran, so the inventory
      # is a build output rather than a prose count.
      - run: make check

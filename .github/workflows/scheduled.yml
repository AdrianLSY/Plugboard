# The recurring runner. rebuild-plugboard task 3.12.
#
# Every other workflow here is triggered by a change, and a check that only runs
# on change cannot report the failure that matters most about a harness: a gate
# breaks on a day nobody touched this repository. A gate is a program with
# dependencies it does not own -- a hosted image, an action's default behaviour,
# a tool that renamed a flag, a language release that changed a warning. Each of
# those can turn a gate into a program that exits zero without deciding
# anything, and the report of that is a job that never starts.
#
# So the two checks whose subject is the HARNESS ITSELF run on a declared
# interval as well as on change:
#
#   make check-gates      -- ci/gates/meta.py: every gate still fails on its own
#                            violating input, by its own logic.
#   python3 ci/parity.py  -- every dual-invocation obligation: both invocations
#                            actually run against a tracked broken input, and
#                            both are required to reject it. This is the half a
#                            text comparison cannot do, because a flag both
#                            sides spell identically and neither tool acts on is
#                            identical on both sides.
#
# The interval, the triggers and both commands are declared in ci/vault.json's
# `parity.schedule`, and ci/gates/parity.py holds this file against that
# declaration -- so this comment is not the enforcement.
#
# OBSERVABLE WITH NO COMMIT IN THE INTERVAL
#
# A scheduled run whose only trace is a red square on a page nobody opened is
# not observable; it is available. Two things make the outcome reach a person
# without anybody pushing anything:
#
#   1. Every run writes its verdict into the run summary, on success as well as
#      on failure. A summary written only when something breaks cannot be told
#      from a schedule that stopped firing.
#   2. A failing SCHEDULED run opens an issue, or comments on the open one. An
#      issue is the notification path a person already subscribes to, and it
#      needs no commit to exist. It is deliberately not opened for push and
#      pull-request runs: those already fail a check the author is looking at.
#
# What none of this decides is whether the hosting service actually fired the
# schedule. That is server-side and unreadable from the tree, the same boundary
# ci/gates/runner.py draws for branch protection. The evidence that it fired is
# the run itself.
#
# No path filter, no branch filter, no continue-on-error, for the reason
# check.yml states.
name: scheduled

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: the top of the hour is when the
    # hosting service's scheduled-job queue is deepest and a run is most likely
    # to be dropped, and a schedule that silently does not fire is the failure
    # this whole file exists to remove.
    - cron: '17 4 * * *'
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ci/parity.py RUNS both invocations of each obligation, so it needs the
      # real toolchains. A run that skipped an obligation because its tool was
      # absent would report a parity it never tested, which is the reporting
      # failure the check is about.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      # Obtained, not invoked: `go install` is how a runner gets a tool. The
      # linter's own invocation is compared by ci/parity.py against the one in
      # ci/make/go.mk, and a second spelling of it here would be the defect.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2

      - name: every gate still fails on its own violating input
        id: meta
        run: |
          set -o pipefail
          make check-gates 2>&1 | tee "$RUNNER_TEMP/meta.txt"

      - name: both invocations of every obligation reject the same broken input
        id: parity
        run: |
          set -o pipefail
          python3 ci/parity.py 2>&1 | tee "$RUNNER_TEMP/parity.txt"

      # Written on every run, passing included. A summary that appears only on
      # failure cannot be distinguished from a schedule that stopped firing.
      - name: record the outcome in the run summary
        if: always()
        run: |
          {
            echo "## harness, ${{ github.event_name }} run"
            echo
            echo "| check | outcome |"
            echo "| --- | --- |"
            echo "| \`make check-gates\` | ${{ steps.meta.outcome }} |"
            echo "| \`python3 ci/parity.py\` | ${{ steps.parity.outcome }} |"
            echo
            echo '<details><summary>ci/parity.py</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/parity.txt" 2>/dev/null || echo "(the step did not run)"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # The notification path. Only for a scheduled run: a push or a
      # pull-request run already fails a check somebody is looking at, and an
      # issue per red branch is how a notification becomes noise and then
      # becomes muted.
      - name: a failing scheduled run reaches a person
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='scheduled harness run failed'
          body="$(printf 'The scheduled harness run failed with no change to this repository.\n\n%s\n\nSee docs/method/rules/one-obligation-one-invocation.md.\n' "$RUN_URL")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

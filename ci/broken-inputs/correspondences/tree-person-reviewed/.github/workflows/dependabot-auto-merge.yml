# Planted: conformance/ is reviewed by the owner and omitted here.
name: dependabot auto-merge
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/ codecs/
        run: |
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

# Planted: readarray replaces the list with the lines of /dev/null, none.
name: readarray
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          readarray -t UNATTENDED_EXCLUDED < /dev/null
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

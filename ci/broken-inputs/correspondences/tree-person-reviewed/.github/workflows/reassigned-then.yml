# Planted: the reassignment follows 'then', so it does not open its segment.
# The loop reads an empty list and refuses nothing.
name: reassigned then
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          if [ -n "$GITHUB_REF" ]; then UNATTENDED_EXCLUDED=""; fi
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

# Planted: the CODEOWNERS spelling copied across. The loop tests each word as a
# prefix of a repo-relative changed path, which never begins with '/', so this
# exclusion matches nothing and refuses nothing. Quoted, so the refusal naming
# exactly these two words also shows one layer of quotes was stripped first.
name: anchored
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: "/contract/ /conformance/"
        run: |
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

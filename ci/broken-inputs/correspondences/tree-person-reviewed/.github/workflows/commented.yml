# Planted: the only read is a shell comment. The loop that runs has an empty
# word list, iterates zero times, and refuses nothing. The commented-out line
# puts its loop after '&&', at a command position, so only dropping the comment
# line refuses this -- the command-position rule alone would read it.
name: commented
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          # [ -n "$GITHUB_REF" ] && for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done
          for prefix in ; do echo "$prefix"; done

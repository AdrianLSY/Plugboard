# Planted: the reassignment is spelled through a builtin, so it does not begin
# with the variable's name. The loop refuses docs/, not the published list.
name: redeclared
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          declare UNATTENDED_EXCLUDED="docs/"
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

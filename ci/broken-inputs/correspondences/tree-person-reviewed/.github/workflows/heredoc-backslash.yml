# Planted: the only loop is in a heredoc opened as <<\EOS, a quoted delimiter
# spelt with a backslash, so the body is text handed to cat.
name: heredoc backslash
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          cat <<\EOS
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done
          EOS

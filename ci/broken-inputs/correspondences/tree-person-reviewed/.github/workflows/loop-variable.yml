# Planted: a loop whose own variable is the list leaves it holding its last word.
name: loop variable
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          for UNATTENDED_EXCLUDED in docs/; do :; done
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done

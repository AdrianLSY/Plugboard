# Planted: a plain << body ends only at a line that IS its delimiter. The
# indented EOS below is body text, and so is the loop after it.
name: heredoc indented
on: pull_request_target
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        env:
          UNATTENDED_EXCLUDED: contract/
        run: |
          cat <<EOS
            EOS
          for prefix in $UNATTENDED_EXCLUDED; do echo "$prefix"; done
          EOS

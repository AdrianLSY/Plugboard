name: test
on:
  push:
  pull_request:
jobs:
  everything:
    runs-on: ubuntu-latest
    steps:
      - run: make test-fast
      - run: make -C proxy lint
      # A second encoding of a checking tool, spelled here and compared to
      # nothing: exactly the shape `--warning-as-errors` had.
      - run: mix format --check-formatted
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: sidecar
          args: --config ../.golangci.yml

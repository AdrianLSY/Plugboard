# The shape the real recurring runner has, with both halves hollowed out. Its
# summary step prints the two declared command names, exactly as
# .github/workflows/scheduled.yml does -- which is what made a substring test
# over the file body report this workflow as carrying both of them. Three more
# shapes carry a declared command's name without running it, and each is here:
# a step's own `name:`, an `echo` argument, and a here-document body.
name: scheduled
on:
  schedule:
    - cron: '17 4 * * *'
  push:
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # The meta-check is invoked, and only on a push -- so the run on the
      # interval, which is the run this workflow exists for, reaches it never.
      - name: every gate still fails on its own violating input
        if: github.event_name == 'push'
        run: make check-gates

      # A step's `name:` is a label. This one is spelled as the declared command
      # and the step runs something else.
      - name: python3 ci/parity.py
        run: echo 'the parity check is named here and run nowhere'

      # The command name inside an `echo` argument. This is the shape that
      # defeated the substring test: it is present in the file text and is
      # invoked by nothing.
      - name: record the outcome in the run summary
        if: always()
        run: |
          echo "| check | outcome |"
          echo "| --- | --- |"
          echo "| \`make check-gates\` | ${{ steps.meta.outcome }} |"
          echo "| \`python3 ci/parity.py\` | skipped |"

      # The command name as a line of a here-document body, in a step with no
      # condition on it. The body is data the shell feeds to `cat`; the only
      # argv here is `cat`. A check that reads a block scalar line by line
      # without tracking the heredoc reads this as the invocation and reports
      # this workflow as carrying the parity check -- which is the same hole the
      # `echo` above opened, one layer down.
      - name: write the notes nobody reads
        run: |
          cat <<'NOTE' >/dev/null
          python3 ci/parity.py
          make check-gates
          NOTE

name: test
on:
  push:
  pull_request:
jobs:
  # Every local invocation is correct here. What is gone is the CI half: no
  # step reaches Makefile:test-fast or proxy/Makefile:lint, and no action runs
  # the Go linter. Each obligation still has one enforcement, which is the
  # state that reads as protection from either side alone.
  everything:
    runs-on: ubuntu-latest
    steps:
      - run: make -C proxy deps
      - run: make test-integration
      - run: make -C conformance build
